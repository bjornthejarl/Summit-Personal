version: '3.8'
services:
  summit:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile # optional if named 'Dockerfile'
      args:
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-"your-public-url.com"}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-"your-nextauth-secret"}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-"http://localhost:3000"}
        - CLIENT_AUTH_SECRET=${CLIENT_AUTH_SECRET:-"client-auth-secret"}
        - DATABASE_URL=${DATABASE_URL:-postgresql://someuser:somepass@test.summitfinance.app/summit?sslmode=require}
        # SMTP Configuration (Zoho Mail or other providers)
        - SMTP_HOST=${SMTP_HOST:-"smtp.zoho.com"}
        - SMTP_PORT=${SMTP_PORT:-"465"}
        - SMTP_SECURE=${SMTP_SECURE:-"true"}
        - SMTP_USER=${SMTP_USER:-"your-email@zoho.com"}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-"your-app-password"}
        - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-"your-email@zoho.com"}
        - SMTP_FROM_NAME=${SMTP_FROM_NAME:-"Summit Finance"}
        # Payment Integration (Optional - can be left empty for deployment without payments)
        - XENDIT_SECRET_KEY=${XENDIT_SECRET_KEY:-""}
        - XENDIT_CALLBACK_VERIFICATION_TOKEN=${XENDIT_CALLBACK_VERIFICATION_TOKEN:-""}
        - CRON_API_KEY=${CRON_API_KEY:-"your-secure-cron-api-key"}
        - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost}
        - MINIO_PORT=${MINIO_PORT:-9000}
        - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
        - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
        - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
        - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-summit}
        - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
        - NEXT_PUBLIC_DISABLE_SIGNUP=${NEXT_PUBLIC_DISABLE_SIGNUP:-1}
    ports:
      - "3000:3000"
    image: geraldkugie/summit:1.0.0
    environment:
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-"your-public-url.com"}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-"your-nextauth-secret"}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-"http://localhost:3000"}
      - CLIENT_AUTH_SECRET=${CLIENT_AUTH_SECRET:-"client-auth-secret"}
      - DATABASE_URL=${DATABASE_URL:-postgresql://someuser:somepass@test.summitfinance.app/summit?sslmode=require}
      # SMTP Configuration (Zoho Mail or other providers)
      - SMTP_HOST=${SMTP_HOST:-"smtp.zoho.com"}
      - SMTP_PORT=${SMTP_PORT:-"465"}
      - SMTP_SECURE=${SMTP_SECURE:-"true"}
      - SMTP_USER=${SMTP_USER:-"your-email@zoho.com"}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-"your-app-password"}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-"your-email@zoho.com"}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-"Summit Finance"}
      # Payment Integration (Optional - can be left empty for deployment without payments)
      - XENDIT_SECRET_KEY=${XENDIT_SECRET_KEY:-""}
      - XENDIT_CALLBACK_VERIFICATION_TOKEN=${XENDIT_CALLBACK_VERIFICATION_TOKEN:-""}
      - CRON_API_KEY=${CRON_API_KEY:-"your-secure-cron-api-key"}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-summit}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${NEXT_PUBLIC_DISABLE_SIGNUP:-1}
